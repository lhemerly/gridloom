name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  test-rust:
    name: Rust Test Suite & Benchmark Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Cached build-script output can survive without DuckDB's downloaded shared library.
      - name: Install locked DuckDB native library
        shell: bash
        run: |
          duckdb_version=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          version = next(p["version"] for p in packages if p["name"] == "libduckdb-sys")
          encoded = int(version.split(".")[1])
          print(f"{encoded // 10000}.{encoded // 100 % 100}.{encoded % 100}")
          PY
          )
          duckdb_native_dir="$RUNNER_TEMP/gridloom-duckdb/$duckdb_version"
          mkdir -p "$duckdb_native_dir"
          curl --fail --location --retry 3 \
            "https://github.com/duckdb/duckdb/releases/download/v$duckdb_version/libduckdb-linux-amd64.zip" \
            --output "$duckdb_native_dir/libduckdb.zip"
          unzip -q -o "$duckdb_native_dir/libduckdb.zip" -d "$duckdb_native_dir"
          test -s "$duckdb_native_dir/libduckdb.so"
          echo "DUCKDB_LIB_DIR=$duckdb_native_dir" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$duckdb_native_dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$duckdb_native_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Check workspace
        run: cargo check --workspace

      - name: Run unit & integration tests
        run: cargo test --workspace --verbose

      - name: Run V1 Performance Acceptance Protocol
        run: cargo run -p gridloom-server -- --bench

  build-frontend:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Test frontend value contracts
        working-directory: ./frontend
        run: npm test

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
